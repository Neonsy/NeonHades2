name: Deploy Cloudflare Pages

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: production
      url: https://hades2.guide.neonspace.dev
    env:
      PUBLIC_SITE_URL: https://hades2.guide.neonspace.dev
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up project pnpm and Node.js
        uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          package-json-file: project/web/package.json
          cache: true
          cache-dependency-path: project/web/pnpm-lock.yaml
          install: false

      - name: Install dependencies
        working-directory: project/web
        run: pnpm install --frozen-lockfile

      - name: Check and build
        working-directory: project/web
        run: pnpm check

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          workingDirectory: project/web
          command: pages deploy dist --project-name=neonhades2 --branch=main
