<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 860" role="img" aria-labelledby="title desc">
  <title id="title">Nocturnal weapon assembly workbench</title>
  <desc id="desc">A three-quarter workbench with a disassembled crescent weapon, drafting folio, vice, tools, fasteners and reagent vessels arranged as a working plan.</desc>
