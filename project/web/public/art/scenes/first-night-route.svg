<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 820" role="img" aria-labelledby="title desc">
  <title id="title">The opening route through Erebus</title>
  <desc id="desc">A moonlit diagonal route passes a weathered tree, carved route stones and a small witchfire lantern before disappearing through the broken Erebus arch below.</desc>
  <defs>
    <linearGradient id="sky" x1="603" y1="40" x2="483" y2="612" gradientUnits="userSpaceOnUse">
      <stop stop-color="#282844"/>
      <stop offset=".42" stop-color="#171b2e"/>
      <stop offset="1" stop-color="#09111a"/>
    </linearGradient>
    <linearGradient id="moon" x1="663" y1="90" x2="783" y2="236" gradientUnits="userSpaceOnUse">
      <stop stop-color="#dce7f3"/>
      <stop offset=".34" stop-color="#8bb9c8"/>
      <stop offset=".68" stop-color="#5c6fa8"/>
      <stop offset="1" stop-color="#31385f"/>
    </linearGradient>
    <linearGradient id="rock" x1="185" y1="224" x2="780" y2="754" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3d4056"/>
      <stop offset=".44" stop-color="#22293a"/>
      <stop offset="1" stop-color="#0d141e"/>
    </linearGradient>
    <linearGradient id="rock-light" x1="254" y1="284" x2="742" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#6b6a82"/>
      <stop offset=".4" stop-color="#494b63"/>
      <stop offset="1" stop-color="#252c3d"/>
    </linearGradient>
    <linearGradient id="bark" x1="70" y1="106" x2="403" y2="744" gradientUnits="userSpaceOnUse">
      <stop stop-color="#32313b"/>
      <stop offset=".42" stop-color="#1d232d"/>
      <stop offset="1" stop-color="#0a1117"/>
    </linearGradient>
    <linearGradient id="teal-fire" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#e0fff8"/>
      <stop offset=".28" stop-color="#71f2dc"/>
      <stop offset=".72" stop-color="#29998f"/>
      <stop offset="1" stop-color="#153f4c"/>
    </linearGradient>
    <linearGradient id="violet-fire" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#f0ebff"/>
      <stop offset=".28" stop-color="#a38cff"/>
      <stop offset=".72" stop-color="#5c49b2"/>
      <stop offset="1" stop-color="#2c285d"/>
    </linearGradient>
  </defs>

